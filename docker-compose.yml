services:
  openldap:
    build:
      context: .
      dockerfile: Dockerfile.openldap
    container_name: ldap-mock
    networks:
      - ldap-net
    ports:
      - "389:1389"  # LDAP
      - "636:1636"  # LDAPS
    environment:
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: admin
      LDAP_ROOT: dc=example,dc=com
      LDAP_CUSTOM_SCHEMA_FILE: /opt/bitnami/openldap/etc/schema/ad_schema.ldif
      LDAP_ENABLE_TLS: no
    volumes:
      - ldap_data:/bitnami/openldap/data
      - slapd_config:/bitnami/openldap/slapd.d
    healthcheck:
      test: ["CMD-SHELL", "pidof slapd > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  ldap_admin:
    image: osixia/phpldapadmin:stable
    container_name: ldap_admin
    networks:
      - ldap-net
    ports:
      - "8080:80"
    environment:
      PHPLDAPADMIN_HTTPS: "false"
      PHPLDAPADMIN_LDAP_CLIENT_TLS: "false"
      PHPLDAPADMIN_LDAP_HOSTS: >-
        #PYTHON2BASH:[{'openldap': [
          {'server': [{'host': 'openldap'}, {'port': 1389}, {'tls': False}]},
          {'login': [{'bind_id': 'cn=admin,dc=example,dc=com'}]}
        ]}]
    depends_on:
      - openldap
    restart: unless-stopped

  ldap-api:
    build:
      context: .
    container_name: ldap-api
    networks:
      - ldap-net
    ports:
      - "8000:8000"
    environment:
      LDAP_MOCK_ROOT: dc=example,dc=com
      LDAP_ADMIN_USER: cn=admin
      LDAP_ADMIN_PASSWORD: admin
      LDAP_MOCK_SERVER_HOST: openldap
      LDAP_MOCK_PORT: 1389
    volumes:
      - ./src:/app/src
    depends_on:
      openldap:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ldap_data:
  slapd_config:

networks:
  ldap-net:
    driver: bridge
